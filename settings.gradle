pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
                includeGroup('fabric-loom')
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Forge'
                    url = uri('https://maven.minecraftforge.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.minecraftforge')
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge Snapshots'
                    url = uri('https://repo.spongepowered.org/repository/maven-public')
                }
            }
            filter {
                includeGroupAndSubgroups('org.spongepowered')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'Numen'
include('core:common')
include('core:forge')
include('api:common')
include('api:forge')
include('ai')
include('ui')

// Forge-only builds do not need Fabric Loom or its separate Minecraft download.
// Pass -Pskip_fabric when producing the Forge artifact for a Forge modpack.
if (!gradle.startParameter.projectProperties.containsKey('skip_fabric')) {
    include('core:fabric')
    include('api:fabric')
}

// 联动模块:一个联动一个,内嵌发布不单独发坐标。见 buildSrc 的 numen-plugin.gradle
include('plugins:ysm')
include('plugins:tlm')
